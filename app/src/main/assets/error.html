<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error TicketSoft</title>

    <!--
        Estilos "Carbon-like": colores, tipografia y botones siguen los
        tokens de IBM Carbon Design System (el mismo sistema que usa
        ts-dispenser-gui), pero escritos a mano en CSS plano -- esta
        pagina la carga el WebView como asset local (file://) y se
        muestra precisamente cuando NO hay conexion, asi que no puede
        depender de un CDN (ni de @carbon/react, ni de una fuente web).
    -->
    <style>
        :root{
            --blue-60:#0f62fe;
            --blue-70:#0043ce;
            --gray-100:#161616;
            --gray-80:#393939;
            --gray-70:#4c4c4c;
            --gray-60:#6f6f6f;
            --gray-20:#e0e0e0;
            --gray-10:#f4f4f4;
        }
        body{
            background:#000000;
            font-family:'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }
        .window{
            width:400px;
            background:#ffffff;
            border-radius:0;
            box-shadow:0 20px 50px rgba(0,0,0,.6);
            padding:32px;
        }
        .logo{
            display:block;
            margin:0 auto;
        }
        h3{
            margin:24px 0 8px;
            font-size:20px;
            font-weight:600;
            line-height:1.3;
            color:var(--gray-100);
        }
        p{
            margin:0 0 24px;
            font-size:14px;
            line-height:1.4;
            color:var(--gray-70);
        }
        label{
            display:block;
            font-size:12px;
            color:var(--gray-70);
            margin-bottom:4px;
        }
        .buttons{
            display:flex;
            gap:2px;
        }
        button{
            flex:1;
            height:48px;
            font-size:14px;
            font-weight:400;
            border:none;
            border-radius:0;
            background:var(--blue-60);
            color:#fff;
            cursor:pointer;
        }
        button:active{
            background:var(--blue-70);
        }
        button.secundario{
            background:var(--gray-80);
        }
        button.secundario:active{
            background:var(--gray-70);
        }
        .field{
            margin-bottom:24px;
        }
        #actual{
            font-size:14px;
            color:var(--gray-100);
            background:var(--gray-10);
            padding:11px 16px;
            word-break:break-all;
        }
        input{
            display:block;
            width:100%;
            box-sizing:border-box;
            height:40px;
            padding:0 16px;
            font-size:14px;
            font-family:inherit;
            color:var(--gray-100);
            border:none;
            border-bottom:1px solid var(--gray-60);
            background:var(--gray-10);
        }
        input:focus{
            outline:none;
            border-bottom:2px solid var(--blue-60);
        }
        hr{
            display:none;
        }
        .hidden{display:none}
    </style>
</head>

<body>

<div class="window">

    <div id="error">
        <img class="logo" src="file:///android_res/drawable/logo_ticketsoft.webp" width="160">
        <h3>Sin conexión al servidor</h3>
        <p>No se pudo establecer comunicación con TicketSoft.</p>
        <div class="buttons">
            <button onclick="location.reload()">Reintentar</button>
            <button class="secundario" onclick="showPrefs()">Preferencias</button>
        </div>
    </div>

    <div id="prefs" class="hidden">
        <h3>Configuración</h3>

        <div class="field">
            <label>URL actual</label>
            <div id="actual"></div>
        </div>

        <div class="field">
            <label>Nueva URL</label>
            <input id="url" placeholder="http://192.168.1.100:8000">
        </div>

        <div class="buttons">
            <button onclick="guardar()">Guardar</button>
            <button class="secundario" onclick="volver()">Volver</button>
        </div>
    </div>

</div>

<script>
    function showPrefs(){
        const actual = Android.getUrl();

        document.getElementById('actual').innerText = actual;
        document.getElementById('url').value = actual;

        document.getElementById('error').classList.add('hidden');
        document.getElementById('prefs').classList.remove('hidden');
    }

    function volver(){
        document.getElementById('prefs').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
    }

    function guardar(){
        const nueva = document.getElementById('url').value;
        Android.saveUrl(nueva);
        volver();
        Android.reloadApp();
    }
</script>

</body>
</html>
