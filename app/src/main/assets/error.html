<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error TicketSoft</title>

    <style>
        body{
            background:radial-gradient(circle at top,#3fa3ff,#0a7bfb,#2c5364);
            font-family:Segoe UI,Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }
        .window{
            width:380px;
            background:#f2f2f2;
            border-radius:8px;
            box-shadow:0 20px 50px rgba(0,0,0,.6);
            overflow:hidden;
            padding:25px;
        }
        h3{
            margin:15px 0 8px;
        }
        p{
            margin:0 0 15px;
            color:#333;
        }
        .buttons{
            display:flex;
            gap:10px;
        }
        button{
            flex:1;
            padding:12px;
            font-size:15px;
            border:none;
            border-radius:6px;
            background:#0078d7;
            color:#fff;
        }
        button.secundario{
            background:#6c757d;
        }
        input{
            width:100%;
            box-sizing:border-box;
            padding:8px 0;
            font-size:14px;
            border:none;
            border-bottom:1px solid #999;
            background:transparent;
            margin-bottom:15px;
        }
        hr{
            border:none;
            border-top:1px solid #ccc;
            margin:10px 0 15px;
        }
        .hidden{display:none}
    </style>
</head>

<body>

<div class="window">

    <div id="error">
        <img src="file:///android_res/drawable/logo_ticketsoft.webp" width="160"><br>
        <h3>Sin conexión al servidor</h3>
        <p>No se pudo establecer comunicación con TicketSoft.</p>
        <div class="buttons">
            <button onclick="location.reload()">Reintentar</button>
            <button class="secundario" onclick="showPrefs()">Preferencias</button>
        </div>
    </div>

    <div id="prefs" class="hidden">
        <h3>Configuración</h3>

        <p>URL actual:</p>
        <p id="actual" style="margin-top:-10px;"></p>

        <p>Nueva URL</p>
        <input id="url" placeholder="http://192.168.1.100:8000">
        <hr>

        <div class="buttons">
            <button onclick="guardar()">Guardar</button>
            <button class="secundario" onclick="volver()">Volver</button>
        </div>
    </div>

</div>

<script>
    function showPrefs(){
        const actual = Android.getUrl();

        document.getElementById('actual').innerText = actual;
        document.getElementById('url').value = actual;

        document.getElementById('error').classList.add('hidden');
        document.getElementById('prefs').classList.remove('hidden');
    }

    function volver(){
        document.getElementById('prefs').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
    }

    function guardar(){
        const nueva = document.getElementById('url').value;
        Android.saveUrl(nueva);
        volver();
        Android.reloadApp();
    }
</script>

</body>
</html>
